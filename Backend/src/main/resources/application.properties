spring.application.name=prueba
server.port=8081

#Base de datos

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/menino}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



#jpa Uodate para desarrollo
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# Cookie de autenticacion JWT (HttpOnly)
app.auth.cookie.name=auth_token
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.max-age-seconds=86400
