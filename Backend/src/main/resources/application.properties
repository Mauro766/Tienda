spring.application.name=prueba
server.port=8081

#Base de datos

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/menino}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



#jpa Uodate para desarrollo
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# Cookie de autenticacion JWT (HttpOnly)
app.auth.cookie.name=auth_token
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.max-age-seconds=86400

# CORS y URLs
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8081}
